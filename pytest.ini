# Pytest-Einstellungen fuer dieses Projekt.
#
# **Wozu diese Datei da ist.** Ohne sie sammelt pytest vom Projektstamm aus
# alles ein, was wie ein Test aussieht - auch in mitliegenden Fremdbaeumen.
# Am 07.09.2026 brach `pytest -q` deshalb mit einem INTERNALERROR ab: Unter
# `PS5 SDK usw/llvm-project-.../flang/test/Evaluate/test_folding.py` liegt ein
# LLVM-Hilfsskript, das beim blossen Import `sys.exit(1)` aufruft. pytest
# wertet das als Absturz des Sammelvorgangs - der ganze Lauf endete nach
# 102 Fehlern, ohne einen einzigen Projekttest auszufuehren.
#
# Die ausgeschlossenen Ordner enthalten mitgelieferte Werkzeuge und
# Fremdquellen. Deren eigene Tests gehoeren nicht zu diesem Projekt; die
# Projekttests liegen alle als `test_*.py` im Stamm.
#
# `.claude` steht aus einem zweiten Grund in der Liste: Darunter liegen
# git-Arbeitsbaeume (`worktrees/`) mit einer aelteren vollstaendigen Kopie des
# Projekts. pytest fuegt den Ordner eines gefundenen Tests vorn in `sys.path`
# ein - dadurch loeste `import ps5_validator` gegen die **alte** Kopie auf, und
# 147 Testdateien brachen mit ImportError ab, obwohl im Stamm alles vorhanden
# war.
[pytest]
norecursedirs =
    .git
    .claude
    .venv
    .ruff_cache
    .pytest_cache
    .hypothesis
    __pycache__
    build
    dist
    AMPR_PackTools-4.0
    MkPFS-1.0.0
    PS4FFPFSC-0.2.8
    ProsperoPkg-2.5
    UFS2Tool-4.1
    helloworld
    ps5_validator/vendor
    PS5*SDK*
    Backport_Fakelibs
    PlayGo*
    Hintergrundbilder
    Anleitungen

testpaths = .
python_files = test_*.py
