# =============================================================================
# macOS-Bündel bauen und prüfen
# =============================================================================
# Der eigentliche Zweck: Auf dem Entwicklungsrechner gibt es keinen Mac. Alles,
# was die macOS-Fassung betrifft, ist dort nur statisch prüfbar. Dieser Lauf
# holt nach, was nur echte Apple-Hardware beantworten kann:
#
#   1. Findet PyInstaller alle Räder in der passenden Architektur?
#   2. Läuft `codesign --deep` über das vollständige Bündel durch?
#   3. Startet das gebaute Programm überhaupt — und ist seine Laufzeit
#      vollständig? Das beantwortet der Aufruf mit `--cli --help`: Er lädt
#      denselben Interpreter, dieselben Bibliotheken und dieselben
#      eingebetteten Daten wie der Fensterbetrieb, kommt aber ohne Bildschirm
#      aus. Ein GUI-Start scheidet aus, weil die Läufer keine angemeldete
#      Fenstersitzung haben.
#
# Beide Architekturen werden gebaut: macos-14 ist Apple Silicon (arm64),
# macos-15-intel ist Intel (x86_64). Ein Bündel passt immer nur zu einer von
# beiden.
#
# Warum nicht macos-13: Dieser Läufer steht auf der Hardware, die GitHub
# abbaut, und ist entsprechend knapp. Ein Job wartete dort 51 Minuten, ohne
# überhaupt zu starten - während derselbe Bau auf Apple Silicon nach 65
# Sekunden fertig war. macos-15-intel ist der benannte Nachfolger.
# =============================================================================
name: macOS-Bündel

on:
  # Von Hand auslösbar - der Normalfall, wenn eine Fassung fertig ist.
  workflow_dispatch:
  push:
    branches: [main]
    # Nur wenn sich etwas ändert, das in das Bündel eingeht. Ein Lauf kostet
    # auf macOS das Zehnfache an Minuten; für eine Änderung am Changelog lohnt
    # er nicht.
    paths:
      - 'PS5ImageConverter_Pro_FINAL_revised.py'
      - 'PS5ImageConverter_Pro_macos.spec'
      - 'Build_macOS.sh'
      - 'Install_macOS.sh'
      - 'extract_icon_icns.py'
      - 'test_macos_fassung.py'
      - 'ps5_validator/**'
      - 'MkPFS-1.0.0/**'
      - 'requirements.txt'
      - '.github/workflows/macos-buendel.yml'

permissions:
  contents: read

jobs:
  buendel:
    name: ${{ matrix.beschriftung }}
    runs-on: ${{ matrix.laeufer }}
    strategy:
      # Läuft eine Architektur auf einen Fehler, soll die andere trotzdem zu
      # Ende bauen - sonst sieht man nur die Hälfte des Bildes.
      fail-fast: false
      matrix:
        include:
          - laeufer: macos-14
            beschriftung: Apple Silicon (arm64)
          - laeufer: macos-15-intel
            beschriftung: Intel (x86_64)

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          # 3.12, nicht die neueste: Für diese Fassung gibt es für alle
          # benötigten Pakete fertige Räder in beiden Architekturen. Lokal
          # läuft das Projekt auf 3.14.
          python-version: '3.12'

      - name: Umgebung nachsehen
        # Rein zur Diagnose, deshalb ohne Abbruch. Fehlt Tcl/Tk oder ist es zu
        # alt, sagt das Bauskript im nächsten Schritt ohnehin deutlich Bescheid
        # - hier steht die Zahl aber schon im Protokoll, bevor der lange Bau
        # beginnt.
        continue-on-error: true
        run: |
          echo "Architektur: $(uname -m)"
          echo "macOS:       $(sw_vers -productVersion)"
          echo "Python:      $(python --version)"
          python -c 'import tkinter; print("Tcl/Tk:     ", tkinter.TkVersion)'

      - name: Bündel bauen
        # Das Bauskript prüft Interpreter, Tcl/Tk-Version und Pflichtdateien
        # selbst, legt .venv-macos an, holt die Pakete, erzeugt app_icon.icns
        # und signiert am Ende ad hoc. --dmg packt zusätzlich ein Abbild: Das
        # ist auch der Grund, warum hier kein .app hochgeladen wird - die
        # Artefaktablage zippt ihren Inhalt und verliert dabei Rechte und
        # Symlinks, womit die Signatur des Bündels wertlos wäre.
        run: |
          chmod +x Build_macOS.sh
          ./Build_macOS.sh --dmg

      - name: Signatur nachsehen
        run: |
          codesign --display --verbose=2 "dist/PS5 Dump & Image Converter.app"
          codesign --verify --deep --strict --verbose=2 "dist/PS5 Dump & Image Converter.app"

      - name: Rauchtest — startet das gebaute Programm?
        run: |
          "dist/PS5 Dump & Image Converter.app/Contents/MacOS/PS5_Dump_Image_Converter" --cli --help

      - name: Tests der macOS-Fassung
        run: |
          .venv-macos/bin/python -m unittest test_macos_fassung -v

      - name: Plattformschicht am laufenden System
        # Auf jedem anderen System liefert dieser Aufruf nur die gemockte
        # Antwort. Hier steht, was macOS wirklich sagt.
        run: |
          .venv-macos/bin/python -c "
          import sys
          sys.path.insert(0, '.')
          from ps5_validator.utils import plattform as p
          print('System:  ', p.systemname())
          print('Schrift: ', p.UI_SCHRIFT, '/', p.MONO_SCHRIFT)
          print('Konfig:  ', p.konfigurationsordner())
          print('Hinweis: ', p.nur_windows_hinweis('UFS2Tool'))
          "

      - name: PS4-Helfer im fertigen Buendel
        # Der Beleg fuer die Korrekturen an der Helfersuche. Im Buendel
        # liegen die Windows- und die Mac-Fassung nebeneinander, und die
        # Mac-Fassung gibt es nur fuer Apple Silicon. Zwei Fehler wurden so
        # gefunden: die .exe auf dem Mac ("Permission denied", Errno 13) und
        # die arm64-Datei auf einem Intel-Mac ("Bad CPU type", Errno 86).
        # Beides zeigt sich nur auf echter Apple-Hardware, am gebauten .app -
        # und je nach Laeufer ist das RICHTIGE Ergebnis ein anderes.
        run: |
          set -e
          WURZEL=$(find "dist/PS5 Dump & Image Converter.app/Contents" -maxdepth 2 -type d -name 'PS4FFPFSC*' | head -1)
          echo "Werkzeugordner: $WURZEL"
          test -n "$WURZEL"
          .venv-macos/bin/python -c "
          import platform, subprocess, sys
          from pathlib import Path
          wurzel = Path(sys.argv[1])
          sys.path.insert(0, str(wurzel))
          from ps4ffpsc.inventory import find_extractor
          from ps4ffpsc.dlc_embed import find_dlc_helper
          from ps4ffpsc.util import executable_architectures
          cpu = platform.machine()
          print('Architektur:', cpu)
          for datei in sorted((wurzel / 'bin').iterdir()):
              print('   %-22s %s' % (datei.name, sorted(executable_architectures(datei)) or 'kein Mach-O'))
          entpacker = find_extractor(wurzel)
          try:
              helfer = find_dlc_helper(wurzel)
          except Exception as fehler:
              helfer = None
              print('DLC-Helfer: keiner (%s)' % type(fehler).__name__)
          print('Entpacker: ', entpacker)
          print('DLC-Helfer:', helfer)
          if cpu in ('arm64', 'aarch64'):
              assert entpacker is not None, 'auf Apple Silicon muss einer da sein'
              assert not entpacker.name.endswith('.exe'), 'Windows-Datei gewaehlt'
              assert helfer is not None and not helfer.name.endswith('.exe'), 'Windows-DLC-Helfer gewaehlt'
              fertig = subprocess.run([str(entpacker)], capture_output=True, text=True)
              ausgabe = (fertig.stdout or '') + (fertig.stderr or '')
              print('Start:', fertig.returncode, ausgabe.strip()[:120])
              assert 'ps4_pkg_extract' in ausgabe, 'der Entpacker laeuft nicht'
              print('OK - beide Helfer sind die richtigen und starten.')
          else:
              assert entpacker is None, 'fuer diese Architektur gibt es keinen Bau - es darf keiner angeboten werden'
              assert helfer is None, 'dasselbe gilt fuer den DLC-Helfer'
              print('OK - auf dieser Architektur wird richtigerweise keiner angeboten.')
          " "$WURZEL"

      - name: Abbild ablegen
        uses: actions/upload-artifact@v4
        with:
          name: macos-abbild-${{ matrix.laeufer }}
          path: dist/*.dmg
          if-no-files-found: error
          # 14 statt der üblichen 90 Tage: Das Abbild ist gut 100 MB groß und
          # jederzeit neu baubar.
          retention-days: 14
